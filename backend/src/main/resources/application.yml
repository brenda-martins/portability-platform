spring:
  application:
    name: portability-backend
  datasource:
    url: jdbc:h2:mem:portability;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8080

central:
  base-url: http://localhost:8080/central
  hmac-secret: ${CENTRAL_HMAC_SECRET:dev-secret-change-me}
  mock:
    enabled: true
