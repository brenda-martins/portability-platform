spring:
  application:
    name: portability-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/portability}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:portability}
    password: ${DATABASE_PASSWORD:portability}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

central:
  base-url: http://localhost:8080/central
  hmac-secret: ${CENTRAL_HMAC_SECRET:dev-secret-change-me}
